[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "lataupe"
version = "0.1.0"
description = "AI-assisted HTTP reverse proxy and web application guardian"
readme = "README.md"
requires-python = ">=3.11"
license = "PolyForm-Noncommercial-1.0.0"
license-files = ["LICENSE"]
dependencies = [
  "fastapi>=0.115",
  "httpx>=0.28",
  "LibDOM==0.1.3",
  "markdown-it-py>=4.0",
  "myelin-runtime @ https://github.com/useplx/MyeLiN/archive/refs/tags/v1.0.0.zip#subdirectory=python",
  "qwen35-interface @ https://github.com/useplx/Qwen3.5/archive/refs/tags/v1.0.0.zip#subdirectory=bindings/python",
  "nh3>=0.3",
  "numpy>=2.0",
  "platformdirs>=4.3",
  "PySide6>=6.8",
  "QtPy>=2.4.3",
  "pywebview>=6.0",
  "uvicorn>=0.34",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "ruff>=0.11"]
training = ["ijson>=3.4", "pandas>=2.2", "scikit-learn>=1.6", "seaborn>=0.13", "xgboost>=3.0"]
bundle = [
    "nuitka>=2.8",
    "patchelf>=0.17.2.4; sys_platform == 'linux'",
]

[project.gui-scripts]
lataupe = "app.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
app = ["assets/*.js"]
model = ["assets/features.json", "assets/*.mln"]

[tool.ruff]
line-length = 100

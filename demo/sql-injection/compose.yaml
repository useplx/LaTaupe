name: lataupe-cve-2021-35042

services:
  vulnerable:
    image: vulhub/django@sha256:6b47989e6290a43f98652b44e20bc1bf1d93f54eecd11307e160e96e88310de7
    working_dir: /app
    command: bash /app/entrypoint.sh
    environment:
      PYTHONDONTWRITEBYTECODE: "1"
    healthcheck:
      test:
        - CMD-SHELL
        - python -c "import urllib.request; urllib.request.urlopen('http://localhost:8000/vuln/?order=id')"
      interval: 2s
      timeout: 2s
      retries: 30
    depends_on:
      database:
        condition: service_healthy
    networks:
      - frontend
      - backend
    ports:
      - "127.0.0.1:3000:8000"
    volumes:
      - .:/app:ro

  database:
    image: mysql@sha256:4bc6bc963e6d8443453676cae56536f4b8156d78bae03c0145cbe47c2aad73bb
    environment:
      MYSQL_ROOT_PASSWORD: mysql
      MYSQL_DATABASE: cve
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-pmysql"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - backend
    volumes:
      - database:/var/lib/mysql

networks:
  frontend:
  backend:
    internal: true

volumes:
  database:
